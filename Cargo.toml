[workspace]
resolver = "2"
members = ["crates/multilink-app", "crates/multilink-core", "crates/multilink-mihomo", "crates/multilink-platform"]
exclude = ["EvertyUI"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Software rasterization and font shaping must also be fast under `cargo run`.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

